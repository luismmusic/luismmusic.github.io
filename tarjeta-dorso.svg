<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 550" width="85mm" height="55mm">
  <defs>
    <!-- Resplandor sutil -->
    <radialGradient id="cornerGlow" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#07060d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .font-sans { font-family: 'Space Grotesk', -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; }
  </style>

  <!-- Fondo negro mate -->
  <rect width="850" height="550" fill="#07060d"/>
  <rect width="850" height="550" fill="url(#cornerGlow)"/>

  <!-- COLUMNA IZQUIERDA: Contacto esencial y limpio -->
  <g transform="translate(85, 175)">
    <!-- Teléfono -->
    <text y="0" class="font-mono" font-size="17" font-weight="500" fill="#ffffff" letter-spacing="0.5">
      +34 614 68 72 37
    </text>

    <!-- Email -->
    <text y="55" class="font-mono" font-size="17" font-weight="500" fill="#ffffff" letter-spacing="0.2">
      luisemendezm@gmail.com
    </text>

    <!-- Web -->
    <text y="110" class="font-mono" font-size="17" font-weight="600" fill="#22d3ee" letter-spacing="0.5">
      luismmusic.github.io
    </text>

    <!-- Ciudad -->
    <text y="165" class="font-mono" font-size="16" font-weight="400" fill="#a7a3bf" letter-spacing="0.5">
      Valencia, España
    </text>
  </g>

  <!-- COLUMNA DERECHA: Código QR minimalista (escaneo instantáneo al portafolio) -->
