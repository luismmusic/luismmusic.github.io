<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 550" width="85mm" height="55mm">
  <defs>
    <!-- Gradientes neón profesionales -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9b5cff"/>
      <stop offset="60%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9b5cff" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#22d3ee" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.6"/>
    </linearGradient>

    <radialGradient id="ambientGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#9b5cff" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#07060d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .font-sans { font-family: 'Space Grotesk', -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; }
  </style>

  <!-- Fondo negro mate profundo -->
  <rect width="850" height="550" fill="#080711"/>

  <!-- Resplandor sutil de fondo -->
  <rect width="850" height="550" fill="url(#ambientGlow)"/>

  <!-- Marco perimetral fino de acabado metálico / corte seguro -->
  <rect x="28" y="28" width="794" height="494" rx="12" fill="none" stroke="url(#borderGrad)" stroke-width="1.2"/>

  <!-- CONTENIDO CENTRALIZADO Y ELEGANTE -->
  <g transform="translate(425, 125)" text-anchor="middle">
    <!-- Logotipo LM -->
    <rect x="-32" y="0" width="64" height="64" rx="16" fill="url(#neonGrad)"/>
    <text x="0" y="43" class="font-sans" font-size="28" font-weight="800" fill="#07060d" letter-spacing="1">LM</text>

    <!-- Sub-marca -->
    <text x="0" y="88" class="font-sans" font-size="20" font-weight="500" fill="#ecebf5" letter-spacing="2">
      luis<tspan font-weight="800" fill="#22d3ee">m</tspan>music
    </text>

    <!-- Nombre del profesional -->
    <text x="0" y="180" class="font-sans" font-size="44" font-weight="700" fill="url(#textGrad)" letter-spacing="-0.3">
      Luis Enrique Méndez Mora
    </text>

    <!-- Título / Disciplinas -->
    <text x="0" y="222" class="font-mono" font-size="13" font-weight="600" fill="#22d3ee" letter-spacing="2.5">
      PRODUCTOR MUSICAL  ·  INGENIERO DE AUDIO  ·  CONSULTOR ACÚSTICO
    </text>

    <!-- Línea sutil de acento -->
    <line x1="-140" y1="256" x2="140" y2="256" stroke="url(#borderGrad)" stroke-width="1.2"/>

    <!-- Distintivo prestigioso -->
    <text x="0" y="284" class="font-mono" font-size="11.5" font-weight="500" fill="#a7a3bf" letter-spacing="1.8">
      GANADOR DEL PREMIO ARPA
    </text>

    <!-- URL web minimalista al pie -->
    <text x="0" y="360" class="font-sans" font-size="15" font-weight="600" fill="#ffffff" letter-spacing="1.5">
      luismmusic.github.io
    </text>
  </g>
</svg>
