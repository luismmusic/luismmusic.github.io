<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 550" width="85mm" height="55mm">
  <defs>
    <!-- Gradiente neón sutil para el isotipo -->
    <linearGradient id="lmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9b5cff"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <!-- Resplandor ambiental suave -->
    <radialGradient id="softGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9b5cff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#07060d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .font-sans { font-family: 'Space Grotesk', -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; }
  </style>

  <!-- Fondo negro mate -->
  <rect width="850" height="550" fill="#07060d"/>
  <rect width="850" height="550" fill="url(#softGlow)"/>

  <!-- CONTENIDO MINIMALISTA CENTRADO -->
  <g transform="translate(425, 205)" text-anchor="middle">
    <!-- Monograma LM -->
    <rect x="-30" y="-10" width="60" height="60" rx="16" fill="url(#lmGrad)"/>
    <text x="0" y="32" class="font-sans" font-size="26" font-weight="800" fill="#07060d" letter-spacing="1">LM</text>

    <!-- Nombre -->
    <text x="0" y="115" class="font-sans" font-size="38" font-weight="700" fill="#ffffff" letter-spacing="-0.3">
      Luis Enrique Méndez Mora
    </text>

    <!-- Disciplina -->
    <text x="0" y="152" class="font-mono" font-size="13" font-weight="500" fill="#22d3ee" letter-spacing="2.8">
      PRODUCTOR MUSICAL  ·  INGENIERO DE AUDIO
    </text>
  </g>
</svg>
